# Genera los guiones con la API de Claude y los guarda en public/guiones.json.
# Se ejecuta a mano: Actions → «Generar guiones» → Run workflow.
# Necesita el secreto ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions).
name: Generar guiones

on:
  workflow_dispatch:
    inputs:
      cantidad:
        description: 'Cuántos guiones generar'
        required: true
        default: '20'

permissions:
  contents: write

concurrency:
  group: generar-guiones
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar la clave
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Falta el secreto ANTHROPIC_API_KEY. Añádelo en Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Generar guiones con Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generar-guiones.mjs "${{ inputs.cantidad }}"

      - name: Guardar los guiones en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/guiones.json
          git commit -m "Actualizar guiones generados con IA" || echo "Sin cambios"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: guiones
          path: public/guiones.json
